[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-rl-action-gate"
version = "0.1.0"
description = "Runtime safety shield for sequential decision systems that allows, substitutes or blocks proposed actions against explicit constraints."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Syed Hafiz Ali"}]

[tool.setuptools]
py-modules = ["safe_rl_action_gate"]
